<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#cc0000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HouseOfCrust" />
    <meta name="application-name" content="HouseOfCrust" />
    <meta name="description" content="Order delicious food from House of Crust, Bahawalpur. Har Bite Mein Mohabbat." />
    <title>House Of Crust | Order Online</title>

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/do3pfwdv5/image/upload/v1780941886/houseofcrust_u5fhjt.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://res.cloudinary.com/do3pfwdv5/image/upload/v1780941886/houseofcrust_u5fhjt.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="https://res.cloudinary.com/do3pfwdv5/image/upload/v1780941886/houseofcrust_u5fhjt.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="https://res.cloudinary.com/do3pfwdv5/image/upload/v1780941886/houseofcrust_u5fhjt.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/do3pfwdv5/image/upload/v1780941886/houseofcrust_u5fhjt.png" />
    <link rel="shortcut icon" type="image/png" href="https://res.cloudinary.com/do3pfwdv5/image/upload/v1780941886/houseofcrust_u5fhjt.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ═══════════════════════════════════════════ -->
    <!--   PERFORMANCE: DNS Prefetch & Preconnect    -->
    <!-- ═══════════════════════════════════════════ -->
    <!-- Cloudinary: all images/videos are from here -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <!-- Google Fonts: if any font is loaded -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ═══════════════════════════════════════════ -->
    <!--   PERFORMANCE: Preload Critical Assets      -->
    <!-- ═══════════════════════════════════════════ -->
    <!-- Hero banner image — LCP element, must load first -->
    <link
      rel="preload"
      as="image"
      href="https://res.cloudinary.com/do3pfwdv5/image/upload/w_900,q_auto,f_auto,dpr_auto/v1780715052/banner_fkh5lf.jpg"
      fetchpriority="high"
    />
    <!-- Logo — shown above the fold in the splash -->
    <link
      rel="preload"
      as="image"
      href="https://res.cloudinary.com/do3pfwdv5/image/upload/v1780941886/houseofcrust_u5fhjt.png"
      fetchpriority="high"
    />

    <!-- ═══════════════════════════════════════════ -->
    <!--   PERFORMANCE: Critical Inline CSS          -->
    <!--   (Prevents flash of unstyled content)      -->
    <!-- ═══════════════════════════════════════════ -->
    <style>
      /* Force light mode always & disable zoom */
      html { color-scheme: light only; touch-action: pan-x pan-y; overscroll-behavior: none; }
      body { margin: 0; padding: 0; background: #fff; touch-action: pan-x pan-y; overscroll-behavior: none; }

      /* Skeleton splash screen — shown instantly before React mounts */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #7f0000 0%, #cc0000 50%, #ff4444 100%);
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-splash.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #splash-logo {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 4px solid rgba(255,255,255,0.4);
        object-fit: cover;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        animation: splashPulse 1.6s ease-in-out infinite;
      }
      #splash-title {
        margin-top: 20px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 28px;
        font-weight: 900;
        color: white;
        letter-spacing: 0.5px;
        text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      }
      #splash-tagline {
        margin-top: 6px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 600;
        color: rgba(255,255,255,0.85);
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      #splash-dots {
        display: flex;
        gap: 8px;
        margin-top: 32px;
      }
      #splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,0.6);
        animation: splashDot 1.2s ease-in-out infinite;
      }
      #splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      #splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        50% { transform: scale(1.05); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
      }
      @keyframes splashDot {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
      /* Prevent FOUC when root is empty */
      #root:empty { min-height: 100vh; }
    </style>
  </head>
  <body>
    <!-- Instant splash — visible before any JS loads -->
    <div id="app-splash">
      <img
        id="splash-logo"
        src="https://res.cloudinary.com/do3pfwdv5/image/upload/v1780941886/houseofcrust_u5fhjt.png"
        alt="House of Crust"
        fetchpriority="high"
      />
      <div id="splash-title">
        <span style="color:#ff8888">House</span>
        <span style="color:#ffffff"> Of </span>
        <span style="color:#FAC811">Crust</span>
      </div>
      <div id="splash-tagline">Har Bite Mein Mohabbat</div>
      <div id="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      // Hide native splash as soon as React renders
      (function() {
        var splash = document.getElementById('app-splash');
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            splash.classList.add('hidden');
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
        // Fallback: hide after 3s max no matter what
        setTimeout(function() {
          if (splash) splash.classList.add('hidden');
        }, 3000);
      })();

      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              // Check for SW update in background
              reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New content available — silently update
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(function(err) {
              console.warn('[PWA] SW registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
